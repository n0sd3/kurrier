<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kurrier — Offline</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: #ffffff;
				color: #18181b;
				text-align: center;
				padding: 2rem;
				box-sizing: border-box;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #18181b;
					color: #fafafa;
				}
			}
			.card {
				max-width: 26rem;
			}
			img {
				width: 64px;
				height: 64px;
				margin-bottom: 1.5rem;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0 0 0.5rem;
			}
			p {
				margin: 0;
				opacity: 0.7;
				line-height: 1.5;
			}
			button {
				margin-top: 1.5rem;
				padding: 0.5rem 1.25rem;
				border-radius: 0.5rem;
				border: none;
				background: #2563eb;
				color: white;
				font-size: 0.9rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img src="/icons/icon-192.png" alt="Kurrier" />
			<h1>You're offline</h1>
			<p>Kurrier needs a connection to load your mail, calendar, contacts and files. Reconnect and try again.</p>
			<button onclick="location.reload()">Retry</button>
		</div>
	</body>
</html>
